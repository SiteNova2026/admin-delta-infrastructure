
services:
  # ==========================================
  # POSTGRESQL
  # ==========================================
  postgres:
    image: postgres:17
    container_name: admin-delta-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # No public port in production.
    # Backend services connect using postgres:5432.
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    shm_size: 256mb
    mem_limit: 2g
    cpus: 2.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - admin-delta-network

  # ==========================================
  # REDIS
  # ==========================================
  redis:
    image: redis:8-alpine
    container_name: admin-delta-redis
    restart: unless-stopped

    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}

    # No public port in production.
    # Backend services connect using redis:6379.
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data

    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    mem_limit: 512m
    cpus: 1.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - admin-delta-network

  # ==========================================
  # KAFKA - SINGLE NODE KRaft
  # ==========================================
  kafka:
    image: apache/kafka:4.1.2
    container_name: admin-delta-kafka
    hostname: kafka
    restart: unless-stopped

    # Internal Docker network only.
    # No public Kafka port.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - ./kafka/data:/var/lib/kafka/data

    mem_limit: 2g
    cpus: 2.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - admin-delta-network

  # ==========================================
  # PGADMIN - DEVELOPMENT ONLY
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: admin-delta-pgadmin
    restart: unless-stopped
    profiles:
      - development

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - "127.0.0.1:5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - admin-delta-network

  # ==========================================
  # REDIS INSIGHT - DEVELOPMENT ONLY
  # ==========================================
  redis-insight:
    image: redis/redisinsight:latest
    container_name: admin-delta-redis-insight
    restart: unless-stopped
    profiles:
      - development

    ports:
      - "127.0.0.1:5540:5540"

    volumes:
      - redis_insight_data:/data

    networks:
      - admin-delta-network

  # ==========================================
  # KAFKA UI - DEVELOPMENT ONLY
  # ==========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: admin-delta-kafka-ui
    restart: unless-stopped
    profiles:
      - development

    environment:
      DYNAMIC_CONFIG_ENABLED: "false"
      KAFKA_CLUSTERS_0_NAME: admin-delta
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    ports:
      - "127.0.0.1:8085:8080"

    networks:
      - admin-delta-network

volumes:
  postgres_data:
    external: true
    name: admin-delta-postgres-data

  redis_data:
    external: true
    name: admin-delta-redis-data

  pgadmin_data:
    external: true
    name: admin-delta-pgadmin-data

  redis_insight_data:
    external: true
    name: admin-delta-redis-insight-data

networks:
  admin-delta-network:
    external: true
    name: admin-delta-network
